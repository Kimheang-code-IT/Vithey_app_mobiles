spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: ${RABBIT_CONCURRENCY:1}
        max-concurrency: ${RABBIT_MAX_CONCURRENCY:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

vithey:
  jwt:
    secret: ${VITHEY_JWT_SECRET}
    access-token-ttl: ${VITHEY_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${VITHEY_REFRESH_TOKEN_TTL:7d}
  events:
    exchange: ${VITHEY_EVENTS_EXCHANGE:vithey.events}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      content-service:
        base-config: default
      file-service:
        base-config: default
      user-profile-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
