# Build and run Config Server from this folder:
#   docker compose up -d --build
#
# Requires vithey-network + Eureka (start infrastructure stack first):
#   cd .. && docker compose up -d

services:
  config-server:
    build:
      context: ../..
      dockerfile: infrastructure/config-server/Dockerfile
      args:
        SERVICE_PORT: 8888
    image: vithey-config-server:local
    container_name: vithey-config-server
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO_LOCATION: file:/app/config-repo
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - vithey-network
    restart: unless-stopped

networks:
  vithey-network:
    external: true
    name: vithey-network
