server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: map-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${MAP_DB_URL:jdbc:postgresql://localhost:5432/map_db}
    username: ${MAP_DB_USERNAME:postgres}
    password: ${MAP_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vithey:
  jwt:
    secret: ${VITHEY_JWT_SECRET:change-me-to-a-strong-256-bit-secret-for-local-dev}
  map:
    google:
      # Server-restricted Places API key. Never exposed to clients, never logged.
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
      connect-timeout-ms: ${GOOGLE_PLACES_CONNECT_TIMEOUT_MS:5000}
      response-timeout-ms: ${GOOGLE_PLACES_RESPONSE_TIMEOUT_MS:10000}
      # Optional template to build client-visible photo URLs from a Google photo
      # resource name, e.g. https://cdn.example.com/places-photos/{name}
      photo-url-template: ${GOOGLE_PLACES_PHOTO_URL_TEMPLATE:}
    cache:
      search-ttl: ${MAP_CACHE_SEARCH_TTL:5m}
      detail-ttl: ${MAP_CACHE_DETAIL_TTL:24h}

resilience4j:
  circuitbreaker:
    instances:
      googlePlaces:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
