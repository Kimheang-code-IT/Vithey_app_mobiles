# Build and run ONLY content-service from this folder:
#   docker compose up -d --build
#
# 1) Start infrastructure first (once):
#      cd ../../infrastructure && docker compose up -d
# 2) Then from this folder:
#      docker compose up -d --build
#
# Or from backend root:
#   .\scripts\docker-build-service.ps1 content-service -Up

services:
  content-service:
    build:
      context: ../..
      dockerfile: services/content-service/Dockerfile
      args:
        SERVICE_PORT: 8084
    image: vithey-content-service:local
    container_name: vithey-content-service
    env_file:
      - .env.example
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - vithey-network
    restart: unless-stopped

networks:
  vithey-network:
    external: true
    name: vithey-network