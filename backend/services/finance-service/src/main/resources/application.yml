server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: finance-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${FINANCE_DB_USERNAME:postgres}
    password: ${FINANCE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vithey:
  jwt:
    secret: ${VITHEY_JWT_SECRET:change-me-to-a-strong-256-bit-secret-for-local-dev}
  events:
    exchange: ${VITHEY_EVENTS_EXCHANGE:vithey.events}
  finance:
    alert-due-days: ${VITHEY_FINANCE_ALERT_DUE_DAYS:7}
  payment:
    provider:
      # Demo-only external provider. Container-to-container uses the compose
      # service name, e.g. http://fake-payment-service:8090 — never hardcoded
      # in application code.
      base-url: ${FAKE_PAYMENT_BASE_URL:http://localhost:8090}
      api-key: ${FAKE_PAYMENT_API_KEY:change-me}
      connect-timeout-ms: ${FAKE_PAYMENT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${FAKE_PAYMENT_READ_TIMEOUT_MS:10000}
      scenario: ${FAKE_PAYMENT_SCENARIO:SUCCESS}
      payment-method: ${FAKE_PAYMENT_METHOD:DEMO_CARD}
      idempotency-enabled: ${FAKE_PAYMENT_IDEMPOTENCY_ENABLED:true}
