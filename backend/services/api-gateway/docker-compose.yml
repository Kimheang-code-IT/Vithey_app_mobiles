# Build and run ONLY api-gateway from this folder:
#   docker compose up -d --build
#
# 1) Start infrastructure first (once):
#      cd ../../infrastructure && docker compose up -d
# 2) Then from this folder:
#      docker compose up -d --build
#
# Or from backend root:
#   .\scripts\docker-build-service.ps1 api-gateway -Up

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      args:
        SERVICE_PORT: 8080
    image: vithey-api-gateway:local
    container_name: vithey-api-gateway
    env_file:
      - .env.example
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - vithey-network
    restart: unless-stopped

networks:
  vithey-network:
    external: true
    name: vithey-network