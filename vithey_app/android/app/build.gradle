plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def googleMapsApiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY')
if (googleMapsApiKey == null) {
    googleMapsApiKey = System.getenv('GOOGLE_MAPS_API_KEY') ?: ''
}

// Opt-in flag for a local-demo release APK that talks to an HTTP backend
// (e.g. the Docker stack at 10.0.2.2:8080). Production builds must NOT set
// this; release defaults to cleartext disabled.
def releaseCleartext = project.hasProperty('vitheyDemoCleartext') ? 'true' : 'false'

// Release signing material is owner-controlled and lives outside git.
// Create android/key.properties (git-ignored) from key.properties.example.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties.containsKey('storeFile') &&
        keystoreProperties.containsKey('keyAlias')

android {
    namespace "com.vithey.aub_connect_app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.vithey.aub_connect_app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders += [
            GOOGLE_MAPS_API_KEY: googleMapsApiKey,
            usesCleartextTraffic: "false"
        ]
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders += [usesCleartextTraffic: "true"]
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // No owner keystore present (e.g. local checkout). Fall back to
                // debug signing so the release build still runs for smoke tests.
                // A real store distribution MUST provide android/key.properties.
                logger.warn("WARNING: android/key.properties not found; release APK will be signed with the debug key.")
                signingConfig signingConfigs.debug
            }
            manifestPlaceholders += [usesCleartextTraffic: releaseCleartext]
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
