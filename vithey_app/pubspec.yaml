name: aub_connect_app
description: Vithey App — AUB student social, jobs, finance, chat, and AI assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  shadcn_flutter: ^0.0.52
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  connectivity_plus: ^5.0.2
  file_picker: ^8.1.0
  image_picker: ^1.0.7
  video_player: ^2.8.2
  permission_handler: ^11.1.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  stomp_dart_client: ^2.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  mobile_scanner: ^7.4.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  pdf: ^3.13.0
  gpt_markdown: ^1.2.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  google_sign_in_platform_interface: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/app_logo.png
    - assets/images/onboarding/
    - assets/images/locale/
    - assets/images/jobs/
    - assets/images/cv/
    - assets/images/profile/
    - assets/icons/Google Icon.png
    - assets/icons/skills/
    - .env
