[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vithey-ai"
version = "0.2.0"
description = "AI core for Vithey: standard CV generation from user activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["vithey_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
