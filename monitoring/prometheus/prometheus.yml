# Prometheus config — local development, low resource.
#
# Targets are the Vithey Spring Boot services that expose Micrometer/Prometheus
# metrics at /actuator/prometheus. Hostnames are the container_name values from
# backend/docker-compose.yml on the shared `vithey-network`.
#
# Excluded on purpose (no Prometheus metrics endpoint):
#   - external-services/ai-core (FastAPI) has no /metrics
#   - eureka-server / config-server (no micrometer-registry-prometheus)
#   - map-service (opt-in `map` profile; add a job when it runs)

global:
  # 30s keeps scrape/CPU load low for local development.
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-auth-service:8081"]

  - job_name: user-profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-user-profile-service:8082"]

  - job_name: file-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-file-service:8083"]

  - job_name: content-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-content-service:8084"]

  - job_name: career-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-career-service:8085"]

  - job_name: finance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-finance-service:8086"]

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-chat-service:8087"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["vithey-notification-service:8088"]
