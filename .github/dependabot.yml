version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Java / Maven multi-module backend
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Flutter / Dart
  - package-ecosystem: pub
    directory: "/vithey_app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python — AI Core
  - package-ecosystem: pip
    directory: "/external-services/ai-core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python — Fake Payment
  - package-ecosystem: pip
    directory: "/external-services/fake-payment-service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
