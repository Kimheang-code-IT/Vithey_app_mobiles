name: Bug report
description: Report a defect in Vithey / AUB Connect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not paste secrets.** Never include passwords, tokens, API keys,
        `.env` values, `client_secret*.json`, or private keys in this form.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Flutter
        - API Gateway
        - Auth
        - Career
        - Chat
        - Content
        - File
        - Finance
        - Map
        - Notification
        - User Profile
        - Shared Backend
        - Infrastructure
        - AI Core
        - Fake Payment
        - Monitoring
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Flutter/Dart, Java, Docker, emulator/device or browser.
      placeholder: "Windows 11, Flutter 3.44.5, Java 21, Docker Desktop, Android emulator"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs. **Remove any secrets before pasting.**
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help.
    validations:
      required: false
