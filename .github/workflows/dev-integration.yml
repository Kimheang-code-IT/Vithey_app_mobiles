# Level 2 — Integration validation when changes land on dev.
#
# Runs the broader project validation. It does NOT publish images, does NOT
# push any branch, and does NOT deploy anything.

name: Dev Integration

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (full reactor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full backend test suite
        run: mvn -B -f backend/pom.xml test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-backend-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vithey_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.5'
          cache: true
      - name: Prepare env file for assets
        run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ai-core:
    name: AI Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: external-services/ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: external-services/ai-core/pyproject.toml
      - run: pip install -e ".[server,dev]"
      - run: pytest -q

  fake-payment:
    name: Fake Payment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: external-services/fake-payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: external-services/fake-payment-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.demo.yml config --quiet
          docker compose -f backend/infrastructure/docker-compose.yml config --quiet
          docker compose -f monitoring/docker-compose.yml config --quiet
          for d in backend/services/*/; do
            echo "-> $d"
            docker compose -f "$d/docker-compose.yml" config --quiet
          done

  monitoring:
    name: Monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana provisioning and dashboards
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, json, yaml
          for f in glob.glob('monitoring/grafana/provisioning/**/*.yml', recursive=True):
              yaml.safe_load(open(f, encoding='utf-8')); print('OK', f)
          for f in glob.glob('monitoring/grafana/dashboards/*.json'):
              json.load(open(f, encoding='utf-8')); print('OK', f)
          PY
